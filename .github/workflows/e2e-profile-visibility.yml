name: E2E — Profile Visibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  profile-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Aponta para o preview estável do projeto. Pode ser sobrescrito por
      # variável/secret do repositório (vars.E2E_BASE_URL).
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://id-preview--f03d0180-c43f-47ba-9b22-a8b83db1125d.lovable.app' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_PLAYER_ID: ${{ vars.E2E_PLAYER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run profile-visibility E2E
        run: bun run test:e2e -- profile-visibility

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
